<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turing Test and AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EFE4; --paper:#FFFCF6; --paper2:#F9F3E8;
  --ink:#2A2824; --body:#4A463F; --mute:#7B756A; --line:#E6DCCB; --line2:#EFE7D9;
  --sage:#6F9378; --sage-soft:#E5EEE5;
  --clay:#C9694B; --clay-soft:#F6E2D9;
  --ochre:#D4A13E; --ochre-soft:#F7EBCF;
  --plum:#80597C; --plum-soft:#EFE3EE;
  --lagoon:#2F6F73; --lagoon-soft:#DCEBEA;
  --ac:var(--lagoon); --ac-soft:var(--lagoon-soft);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#1A1916; --paper:#23211D; --paper2:#2A2823;
  --ink:#F1EBE0; --body:#D2CBBE; --mute:#A39C8F; --line:#3A3731; --line2:#2F2C27;
  --sage:#8DB397; --sage-soft:#26332A; --clay:#E08A6C; --clay-soft:#3B271F;
  --ochre:#E2B65A; --ochre-soft:#3A3020; --plum:#B58AB0; --plum-soft:#352735;
  --lagoon:#5DA3A7; --lagoon-soft:#1F3334;
}}
:root[data-theme="dark"]{
  --bg:#1A1916; --paper:#23211D; --paper2:#2A2823;
  --ink:#F1EBE0; --body:#D2CBBE; --mute:#A39C8F; --line:#3A3731; --line2:#2F2C27;
  --sage:#8DB397; --sage-soft:#26332A; --clay:#E08A6C; --clay-soft:#3B271F;
  --ochre:#E2B65A; --ochre-soft:#3A3020; --plum:#B58AB0; --plum-soft:#352735;
  --lagoon:#5DA3A7; --lagoon-soft:#1F3334;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;font-size:17px;line-height:1.55;overflow-x:hidden}
button,input,textarea{font-family:inherit;color:inherit;font-size:inherit}
h1,h2{margin:0;font-weight:700;letter-spacing:-.5px}

/* organic backdrop */
.blob{position:fixed;z-index:0;filter:blur(2px);opacity:.55;pointer-events:none}
.b1{width:420px;height:420px;top:-140px;right:-120px;background:var(--ochre-soft);border-radius:58% 42% 63% 37% / 45% 55% 45% 55%;animation:morph 18s ease-in-out infinite}
.b2{width:360px;height:360px;bottom:-120px;left:-120px;background:var(--sage-soft);border-radius:42% 58% 36% 64% / 58% 42% 58% 42%;animation:morph 22s ease-in-out infinite reverse}
.b3{width:240px;height:240px;top:40%;right:-100px;background:var(--plum-soft);border-radius:63% 37% 54% 46% / 55% 48% 52% 45%;animation:morph 26s ease-in-out infinite}
@keyframes morph{0%,100%{border-radius:58% 42% 63% 37% / 45% 55% 45% 55%;transform:rotate(0)}50%{border-radius:40% 60% 38% 62% / 60% 40% 60% 40%;transform:rotate(12deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}60%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}

.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:40px 18px 80px}
.hero{padding:10px 4px 22px}
.hero .kick{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--lagoon);background:var(--lagoon-soft);padding:5px 14px;border-radius:999px}
.hero .kick i{width:8px;height:8px;border-radius:50%;background:var(--lagoon);animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.4}}
.hero h1{font-size:clamp(36px,8vw,58px);line-height:1.02;margin-top:16px}
.hero h1 span{color:var(--clay)}
.hero p{color:var(--body);font-size:18px;margin:14px 0 0;max-width:560px}

.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:28px 26px;margin:18px 0;animation:rise .45s ease-out both;transition:box-shadow .2s}
.card::before{content:"";position:absolute;left:26px;top:-1px;width:56px;height:5px;border-radius:0 0 6px 6px;background:var(--ac)}
.card.miss{box-shadow:0 0 0 3px var(--clay)}
@media (max-width:560px){ .card{padding:22px 18px;border-radius:22px} }
.qt{font-size:21px;font-weight:600;line-height:1.3;letter-spacing:-.2px}

.email{display:flex;gap:10px;align-items:center;margin-top:14px}
.email input{flex:1;border:2px solid var(--line);border-radius:999px;padding:13px 20px;background:var(--paper2);font-size:17px;min-width:0}
.email input:focus{outline:none;border-color:var(--ac)}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.chip{cursor:pointer;border:2px solid var(--line);background:var(--paper2);border-radius:999px;padding:10px 18px;font-size:16px;transition:all .15s;text-align:left}
.chip:hover{border-color:var(--ac);transform:translateY(-1px)}
.chip.other{border-style:dashed}
.otherin{display:block;width:100%;margin-top:12px;border:2px solid var(--ac);border-radius:999px;padding:12px 20px;background:var(--paper2);font-size:16px;animation:rise .25s ease-out}
.otherin:focus{outline:none}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:500;animation:pop .25s ease-out}

/* human or ai */
.tset{background:linear-gradient(160deg,var(--lagoon-soft),var(--paper) 55%)}
.ask{margin-top:12px;font-size:18px;font-weight:500;color:var(--lagoon)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:620px){ .pair{grid-template-columns:1fr} }
.ans{position:relative;display:block;width:100%;text-align:left;cursor:pointer;border:2px solid var(--line);border-radius:22px;background:var(--paper);padding:18px 18px 20px;font-size:16px;line-height:1.55;color:var(--body);transition:transform .18s,border-color .18s,box-shadow .18s}
.ans:hover:not(:disabled){transform:translateY(-3px) rotate(-.4deg);border-color:var(--lagoon);box-shadow:0 10px 24px rgba(47,111,115,.12)}
.ans:nth-child(2):hover:not(:disabled){transform:translateY(-3px) rotate(.4deg)}
.ans:disabled{cursor:default}
.ans .lt{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:46% 54% 50% 50%;background:var(--ochre);color:#fff;font-weight:700;font-size:14px;margin-bottom:10px}
.ans .who{position:absolute;top:16px;right:16px;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;color:#fff;animation:pop .35s ease-out both}
.ans.human{border-color:var(--sage);background:var(--sage-soft)} .ans.human .who{background:var(--sage)}
.ans.ai{opacity:.75} .ans.ai .who{background:var(--plum)}
.ans.picked.ai{opacity:1;border-color:var(--clay)}
.vd{margin-top:12px;font-weight:600;animation:pop .35s ease-out both}
.vd.y{color:var(--sage)} .vd.n{color:var(--clay)}

/* abilities */
.ab{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}
.ab:first-of-type{border-top:0;margin-top:8px}
.seg{display:flex;gap:6px}
.seg button{cursor:pointer;border:2px solid var(--line);background:var(--paper2);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap;transition:all .15s}
.seg button:hover{border-color:var(--mute)}
.seg button.on.v0{background:var(--plum);border-color:var(--plum);color:#fff}
.seg button.on.v1{background:var(--ochre);border-color:var(--ochre);color:#fff}
.seg button.on.v2{background:var(--sage);border-color:var(--sage);color:#fff}
@media (max-width:620px){ .ab{grid-template-columns:1fr} .seg button{flex:1;padding:8px 4px;font-size:13px} }

/* closeness */
.dial{display:flex;align-items:center;gap:18px;margin-top:16px;flex-wrap:wrap}
.big{font-size:60px;font-weight:700;line-height:1;color:var(--ochre);min-width:96px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;flex:1;min-width:240px}
.dots button{flex:1;height:34px;border:0;cursor:pointer;background:var(--line2);border-radius:50%;transition:background .15s,transform .15s}
.dots button:hover{transform:scale(1.12)}
.dots button.on{background:var(--ochre)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px}

textarea{width:100%;border:2px solid var(--line);border-radius:20px;padding:14px 18px;background:var(--paper2);min-height:96px;margin-top:14px;resize:vertical;font-size:17px}
textarea:focus{outline:none;border-color:var(--ac)}

.go{display:block;width:100%;cursor:pointer;margin-top:26px;border:0;border-radius:999px;padding:18px;font-size:19px;font-weight:600;color:#fff;background:linear-gradient(120deg,var(--lagoon),var(--plum));box-shadow:0 10px 26px rgba(47,111,115,.25);transition:transform .15s}
.go:hover{transform:translateY(-2px)}
.go:disabled{opacity:.6;cursor:default}
.err{color:var(--clay);font-weight:500;text-align:center;margin-top:12px;min-height:24px}
.warn{background:var(--clay-soft);color:var(--clay);border-radius:16px;padding:12px 16px;font-size:15px;margin:12px 0}

/* summary */
.sum{animation:rise .5s ease-out both}
.persona{position:relative;overflow:hidden;border-radius:30px;padding:34px 28px;color:#fff;background:linear-gradient(135deg,var(--lagoon),var(--plum) 70%,var(--clay))}
.persona::after{content:"";position:absolute;width:260px;height:260px;right:-80px;top:-90px;background:rgba(255,255,255,.12);border-radius:58% 42% 63% 37% / 45% 55% 45% 55%;animation:morph 14s ease-in-out infinite}
.persona .k{font-size:14px;opacity:.85}
.persona h1{font-size:clamp(32px,7vw,46px);line-height:1.05;margin-top:6px}
.persona p{margin:10px 0 0;opacity:.92;max-width:520px}
.badge{display:inline-block;margin-top:16px;background:rgba(255,255,255,.18);padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:620px){ .grid{grid-template-columns:1fr} }
.tile{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px 22px}
.tile .l{font-size:13px;color:var(--mute)}
.tile .v{font-size:20px;font-weight:600;margin-top:4px;line-height:1.3}
.tile.wide{grid-column:1/-1}
.tdots{display:flex;gap:8px;margin-top:10px}
.tdots span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;animation:pop .4s ease-out both}
.tdots .y{background:var(--sage)} .tdots .n{background:var(--clay)}
.meter{height:14px;border-radius:7px;background:var(--line2);margin-top:12px;position:relative}
.meter i{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--ochre);border:3px solid var(--paper);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.meter b{position:absolute;top:-6px;width:3px;height:26px;background:var(--mute);border-radius:2px;transform:translateX(-50%)}
.mrow{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:10px}
.cmp{display:grid;gap:8px;margin-top:10px}
.cmp div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:15px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p0{background:var(--plum-soft);color:var(--plum)} .p1{background:var(--ochre-soft);color:#9A7220} .p2{background:var(--sage-soft);color:var(--sage)} .pm{background:var(--paper2);color:var(--mute);border:1px solid var(--line)}
.quote{font-size:20px;font-weight:500;line-height:1.4;margin-top:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.ghostbtn{cursor:pointer;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:11px 20px;font-weight:600}
.ghostbtn:hover{border-color:var(--lagoon)}

/* results */
.rtop{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.rtop h1{font-size:34px;flex:1 1 280px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px}
.kpi b{display:block;font-size:34px;line-height:1.1;color:var(--c)}
.kpi span{font-size:14px;color:var(--mute)}
.lab{display:flex;justify-content:space-between;gap:12px;font-size:15px;margin:14px 0 6px}
.stk{display:flex;height:26px;border-radius:13px;overflow:hidden;background:var(--line2);font-size:12px;font-weight:600;color:#fff}
.stk div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;transition:width .6s ease}
.ks{background:var(--sage)} .kc{background:var(--clay)} .kg{background:#A39C8F} .kp{background:var(--plum)} .ko{background:var(--ochre)}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:12px}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--c)}
.hb{display:grid;grid-template-columns:minmax(120px,40%) 1fr 46px;gap:12px;align-items:center;margin:9px 0;font-size:15px}
.hb .tr{height:14px;background:var(--line2);border-radius:7px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--c);border-radius:7px;transition:width .6s ease}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:620px){ .hb{grid-template-columns:1fr 46px} .hb .tr{grid-column:1/-1;order:3} }
.hist{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:10px}
.hist div{flex:1;background:var(--ochre);border-radius:10px 10px 4px 4px;min-height:3px;transition:height .6s ease}
.quotes{display:grid;gap:8px;margin-top:6px}
.quotes div{background:var(--paper2);border-radius:16px;padding:10px 16px}
.src{font-size:13px;color:var(--mute);margin-top:12px}
.hidden{display:none}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap" id="app"></div>

<script>
/* ============ CONFIG ============ */
// Paste the Google Apps Script web app URL (ends in /exec) between the quotes.
const SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE";
// Survey: index.html   Per section: index.html?section=A   Live class results: index.html?results  (or ?results&section=A)
/* ================================ */
(function(){
"use strict";
const params = new URLSearchParams(location.search);
const SECTION = (params.get('section') || '').slice(0, 20);
const CONNECTED = /^https:\/\/script\.google\.com\//.test(SCRIPT_URL);
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (n, d) => d ? Math.round(100 * n / d) : 0;

/* Human answers: Reddit "Explain like I'm five" users, HC3 corpus (Guo et al., 2023, CC-BY-SA). AI answers: Claude. */
const TURING = [
  { id:'t1', q:"Why do new TV seasons usually start in the fall?",
    human:"Traditionally, as school began and the weather became cooler, people were less likely to go out and more likely to stay at home watching television. A new show would reach the widest audience on a weekday evening in the fall. Premier them in the summer and half your audience is out at the beach or the park or a family cookout or on vacation, etc.",
    ai:"It goes back to the early days of network TV. Advertisers bought most of their airtime for the year in one big spring sale, so networks lined up their new shows to start in September. Summer was always treated as the slow season, since people are traveling, outside, or on vacation and fewer of them are watching. Streaming has mostly broken that pattern now." },
  { id:'t2', q:"How do web browsers make money?",
    human:"A lot of people search using the browser's default search provider. Almost all of Firefox's revenue came from Google paying them for searches done from Firefox (they recently switched to Yahoo as the default search provider).",
    ai:"Mostly from search engines. Whenever you type something into the address bar, it goes to a default search engine, and Google and others pay the browser a lot to be that default. Most of Firefox's money has come from Google this way, and Google pays Apple billions to be the default in Safari." },
  { id:'t3', q:"Why is white rice cheaper than brown rice, when white rice takes more processing?",
    human:"Making white rice might be slightly more work, but keeping brown rice from going rancid is also more work, and that is not just a one time thing. But mostly, brown rice is trendy among affluent foodies, who are willing to pay more for it. You can get them for more or less the same price if you shop around and buy in bulk.",
    ai:"The bran layer left on brown rice has oils in it, so it goes rancid in a few months while white rice keeps for years. That means faster turnover, more waste, and more careful storage for stores. White rice is also made in huge volumes, which keeps its cost down, and brown rice gets sold as a health food, so stores can charge a bit more." },
  { id:'t4', q:"Why does a frozen pizza box say to preheat the oven? Can't I just bake it a few minutes longer?",
    human:"Pizza companies want you to keep coming back to their pizzas, so they add foolproof instructions. People have different ovens, so \"cooking\" while preheating is going to have random results, and they just can't tell people to do that if they have terrible ovens.",
    ai:"Every oven heats up at a different speed, so the cook time on the box only works if the oven is already hot. A hot oven also crisps the crust right away. Put the pizza in cold and the crust warms slowly and goes soft, and keeping it frozen while you wait keeps it on the schedule they tested." },
  { id:'t5', q:"Why do fast food meals come with fries and a soft drink?",
    human:"Those things are included because it's a very cheap way to pad their profits. The markups on those things are *HUGE*, and as long as they have you there and can offer you the illusion of increased value... well, they will sell you fries and a beverage for only $0.79 more.",
    ai:"Fries and soda cost the restaurant almost nothing. Potatoes and syrup are cheap, so a drink that costs them a few cents can sell for two dollars. Bundling them into a combo makes you feel like you're getting a deal while the restaurant makes more on every order. Combo meals caught on in the 1970s and 80s." }
];
// Every page load: shuffle the order of the 5 rounds, then flip an independent coin for each round's sides.
// Only the two all-same layouts (human always left, or always right) are redrawn.
(function(){
  const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  for (let i = TURING.length - 1; i > 0; i--) { const j = rnd(i + 1); [TURING[i], TURING[j]] = [TURING[j], TURING[i]]; }
  let flips;
  do { flips = TURING.map(() => rnd(2) === 1); } while (flips.every(f => f) || flips.every(f => !f));
  TURING.forEach((t, i) => t.humanFirst = flips[i]);
})();

const ABILITIES = [
  ["cap_facts","Recalling facts across many fields","AI ahead"],
  ["cap_writing","Writing and summarizing text","AI ahead"],
  ["cap_puzzle","Solving a brand new puzzle","Humans ahead"],
  ["cap_learn","Learning a new skill from a few tries","Humans ahead"],
  ["cap_physical","Physical tasks, like folding laundry","Humans ahead"],
  ["cap_emotion","Understanding emotions and social cues","Mixed"],
  ["cap_planning","Planning over weeks and months","Humans ahead"],
  ["cap_uncertain","Knowing when it is wrong","Humans ahead"]
];
const AB = ["AI ahead","About even","Humans ahead"];
const USE = ["Several times a day","About once a day","A few times a week","Rarely","Never"];
const CLOSEST = ["Specialized","General","Collective","Not intelligence at all"];
const FEEL = ["More concerned than excited","Equally concerned and excited","More excited than concerned"];
const WELCOME = ["Studying and learning new things","Writing and editing","Planning my day and staying productive","Job search and career prep","Coding and data analysis","Managing money and budgets","Health, fitness, and cooking","Creative projects like music, art, or video","Travel and shopping","Games, hobbies, and just for fun"];
const CONCERN = ["Losing jobs or entry-level roles","Misinformation and deepfakes","Privacy and surveillance","People thinking less for themselves","Bias and unfair decisions","Weaker human relationships","Loss of human control"];
const EXCITE = ["Medical and scientific breakthroughs","Saving time on boring tasks","Learning anything, anytime","Starting a business with fewer people","Better decisions from data","Accessibility for people with disabilities","Nothing yet"];

const SINGLE = [
  { id:'use', ac:'ochre', q:"How often do you use AI tools like ChatGPT, Claude, Gemini, or Copilot?", opts:USE },
  { id:'closest', ac:'plum', q:"Which best describes today's AI?", opts:CLOSEST },
  { id:'feeling', ac:'sage', q:"Does the growing use of AI in daily life make you feel...", opts:FEEL },
  { id:'welcome', ac:'lagoon', q:"Where in your life would you most welcome AI?", opts:WELCOME, other:true },
  { id:'concern', ac:'clay', q:"Your biggest concern about AI?", opts:CONCERN, other:true },
  { id:'excite', ac:'sage', q:"What excites you most about AI?", opts:EXCITE, other:true }
];
const A = {};

/* ============ SURVEY (single page) ============ */
function acc(c){ return `--ac:var(--${c});--ac-soft:var(--${c}-soft)`; }
function chipCard(s, delay){
  return `<section class="card" id="c_${s.id}" style="${acc(s.ac)};animation-delay:${delay}s"><div class="qt">${esc(s.q)}</div>
    <div class="chips" data-id="${s.id}">${s.opts.map((o, i) => `<button type="button" class="chip" data-i="${i}">${esc(o)}</button>`).join('')}${s.other ? '<button type="button" class="chip other" data-i="other">Something else...</button>' : ''}</div>
    ${s.other ? `<input class="otherin hidden" id="o_${s.id}" maxlength="120" placeholder="Type your own answer">` : ''}</section>`;
}

function renderSurvey(){
  const S = id => SINGLE.find(s => s.id === id);
  let h = `<header class="hero"><span class="kick"><i></i>Turing test and AI</span>
    <h1>Human or machine? <span>Can you tell?</span></h1>
    <p>Spot the human, rate the machines, and see where you land.</p></header>
    ${CONNECTED ? '' : '<div class="warn">Not connected to a Google Sheet yet. Paste the web app URL into SCRIPT_URL.</div>'}
    <section class="card" id="c_email" style="${acc('lagoon')}"><div class="qt">Your email</div>
      <div class="email"><input type="email" id="email" placeholder="name@school.edu" autocomplete="email"></div></section>`;
  h += chipCard(S('use'), .05);
  TURING.forEach((t, i) => {
    const order = t.humanFirst ? ['human','ai'] : ['ai','human'];
    h += `<section class="card tset" id="c_${t.id}" style="${acc('lagoon')};animation-delay:${.08 + i * .03}s">
      <div class="qt">Which answer did a human write?</div><div class="ask">${esc(t.q)}</div>
      <div class="pair">${order.map((k, j) => `<button type="button" class="ans" data-t="${i}" data-k="${k}"><span class="lt">${'AB'[j]}</span><div>${esc(t[k])}</div></button>`).join('')}</div>
      <div id="vd_${t.id}"></div></section>`;
  });
  h += `<section class="card" id="c_abil" style="${acc('plum')}"><div class="qt">Compared with a typical adult, how does today's AI do?</div>` +
    ABILITIES.map(([k, n]) => `<div class="ab"><div>${esc(n)}</div><div class="seg" data-k="${k}">${AB.map((c, i) => `<button type="button" class="v${i}" data-v="${c}">${c}</button>`).join('')}</div></div>`).join('') + `</section>`;
  h += chipCard(S('closest'), 0);
  h += `<section class="card" id="c_agi_distance" style="${acc('ochre')}"><div class="qt">How close is AI to human-level intelligence?</div>
    <div class="dial"><div class="big" id="bigv">?</div><div style="flex:1;min-width:240px"><div class="dots">${Array.from({length:11}, (_, i) => `<button type="button" data-v="${i * 10}" aria-label="${i * 10}"></button>`).join('')}</div>
    <div class="ends"><span>0 · Nowhere close</span><span>Already there · 100</span></div></div></div></section>`;
  ['feeling','welcome','concern','excite'].forEach(id => h += chipCard(S(id), 0));
  h += `<section class="card" id="c_future" style="${acc('clay')}"><div class="qt">In 2035, AI will...</div><textarea id="future" maxlength="280" placeholder="Finish the sentence"></textarea></section>
    <button class="go" id="go">See my results</button><div class="err" id="err"></div>`;
  app.innerHTML = h;
  wire();
}

function wire(){
  app.querySelectorAll('.chips').forEach(box => box.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const s = SINGLE.find(x => x.id === box.dataset.id);
    const oin = document.getElementById('o_' + s.id);
    if (b.dataset.i === 'other') {
      A[s.id + '_other'] = true; A[s.id] = oin.value.trim();
      oin.classList.remove('hidden'); oin.focus();
    } else {
      A[s.id + '_other'] = false; A[s.id] = s.opts[+b.dataset.i];
      if (oin) oin.classList.add('hidden');
    }
    box.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); b.classList.add('on');
    document.getElementById('c_' + s.id).classList.remove('miss');
  }));
  app.querySelectorAll('.otherin').forEach(inp => inp.oninput = () => {
    const id = inp.id.slice(2); A[id] = inp.value.trim();
    if (A[id]) document.getElementById('c_' + id).classList.remove('miss');
  });
  app.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const t = TURING[+b.dataset.t]; if (A[t.id]) return;
    A[t.id] = b.dataset.k;
    const card = document.getElementById('c_' + t.id); card.classList.remove('miss');
    card.querySelectorAll('.ans').forEach(x => {
      x.disabled = true; x.classList.add(x.dataset.k); if (x === b) x.classList.add('picked');
      x.insertAdjacentHTML('beforeend', `<span class="who">${x.dataset.k === 'human' ? 'Human' : 'AI'}</span>`);
    });
    const ok = b.dataset.k === 'human';
    document.getElementById('vd_' + t.id).innerHTML = `<div class="vd ${ok ? 'y' : 'n'}">${ok ? 'You spotted the human.' : 'The AI fooled you.'}</div>`;
  });
  app.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.onclick = () => {
    A[seg.dataset.k] = b.dataset.v; seg.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
    if (ABILITIES.every(([k]) => A[k])) document.getElementById('c_abil').classList.remove('miss');
  }));
  const dots = app.querySelectorAll('.dots button');
  dots.forEach(b => b.onclick = () => {
    A.agi_distance = +b.dataset.v; document.getElementById('bigv').textContent = A.agi_distance;
    dots.forEach(x => x.classList.toggle('on', +x.dataset.v <= A.agi_distance));
    document.getElementById('c_agi_distance').classList.remove('miss');
  });
  document.getElementById('email').oninput = () => document.getElementById('c_email').classList.remove('miss');
  document.getElementById('go').onclick = submit;
}

function missing(){
  const m = [];
  const em = document.getElementById('email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) m.push('c_email');
  if (!A.use) m.push('c_use');
  TURING.forEach(t => { if (!A[t.id]) m.push('c_' + t.id); });
  if (!ABILITIES.every(([k]) => A[k])) m.push('c_abil');
  if (!A.closest) m.push('c_closest');
  if (A.agi_distance === undefined) m.push('c_agi_distance');
  ['feeling','welcome','concern','excite'].forEach(id => { if (!A[id]) m.push('c_' + id); });
  return m;
}

async function submit(){
  const m = missing();
  app.querySelectorAll('.card').forEach(c => c.classList.toggle('miss', m.includes(c.id)));
  if (m.length) {
    document.getElementById('err').textContent = m.length === 1 ? 'One answer is still missing.' : m.length + ' answers are still missing.';
    document.getElementById(m[0]).scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  const go = document.getElementById('go'); go.disabled = true; go.textContent = 'Sending...';
  A.email = document.getElementById('email').value.trim();
  A.future = document.getElementById('future').value.trim();
  const p = { section: SECTION, email: A.email };
  TURING.forEach(t => p[t.id] = A[t.id] === 'human' ? 'correct' : 'fooled');
  p.turing_score = TURING.filter(t => A[t.id] === 'human').length;
  ABILITIES.forEach(([k]) => p[k] = A[k]);
  ['use','closest','agi_distance','feeling','welcome','concern','excite','future'].forEach(k => p[k] = A[k] ?? '');
  try {
    if (CONNECTED) await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(p) });
    summary(p.turing_score);
  } catch (e) {
    go.disabled = false; go.textContent = 'See my results';
    document.getElementById('err').textContent = 'Could not send. Check your connection and try again.';
  }
}

/* ============ PERSONAL SUMMARY ============ */
function persona(){
  const d = A.agi_distance, f = FEEL.indexOf(A.feeling);
  if (f === 2) return d >= 50 ? ["The Futurist", "You think AI is close to us and you are excited about where it goes."] : ["The Pragmatic Builder", "You see AI as a useful tool that is still far from human, and that excites you."];
  if (f === 1) return d >= 50 ? ["The Curious Navigator", "You see real power in AI and weigh the upside and the risk evenly."] : ["The Measured Observer", "You keep a level head: AI is useful, overhyped in places, and worth watching."];
  return d >= 50 ? ["The Cautious Forecaster", "You think AI is getting close to human ability, and that makes you uneasy."] : ["The Grounded Skeptic", "You see clear limits in today's AI and real reasons to be careful."];
}
function badge(r){ return r === 5 ? "Perfect human detector" : r >= 3 ? "Sharp-eyed reader" : r >= 1 ? "Sometimes fooled" : "Fully charmed by the machine"; }

function summary(r){
  const [name, line] = persona();
  const agree = ABILITIES.filter(([k, , v]) => A[k] === v).length;
  scrollTo(0, 0);
  app.innerHTML = `<div class="sum">
    <div class="persona"><div class="k">Turing test and AI · your result</div><h1>${name}</h1><p>${line}</p><span class="badge">${badge(r)} · ${r} of 5 humans spotted</span></div>

    <div class="grid">
      <div class="tile"><div class="l">Human or AI</div><div class="v">You spotted ${r} of 5</div>
        <div class="tdots">${TURING.map((t, i) => `<span class="${A[t.id] === 'human' ? 'y' : 'n'}" style="animation-delay:${i * .08}s">${A[t.id] === 'human' ? '✓' : '✕'}</span>`).join('')}</div>
        <div class="mrow" id="clsT"></div></div>
      <div class="tile"><div class="l">How close is AI to human-level?</div><div class="v">You said ${A.agi_distance} out of 100</div>
        <div class="meter"><i style="left:${A.agi_distance}%"></i><b id="clsMark" class="hidden"></b></div>
        <div class="mrow"><span>Nowhere close</span><span id="clsD"></span><span>Already there</span></div></div>
      <div class="tile"><div class="l">Today's AI is</div><div class="v">${esc(A.closest)}</div></div>
      <div class="tile"><div class="l">You feel</div><div class="v">${esc(A.feeling)}</div><div class="mrow" id="clsF"></div></div>
      <div class="tile"><div class="l">Biggest concern</div><div class="v">${esc(A.concern)}</div></div>
      <div class="tile"><div class="l">Most exciting</div><div class="v">${esc(A.excite)}</div></div>
      <div class="tile"><div class="l">Most welcome in my life</div><div class="v">${esc(A.welcome)}</div></div>
      <div class="tile"><div class="l">AI use</div><div class="v">${esc(A.use)}</div></div>
      <div class="tile wide"><div class="l">You vs the research: you matched on ${agree} of 8</div>
        <div class="cmp">${ABILITIES.map(([k, n, v]) => `<div><span>${esc(n)}</span><span class="pill p${AB.indexOf(A[k])}">You: ${A[k]}</span><span class="pill pm">Research: ${v}</span></div>`).join('')}</div></div>
      ${A.future ? `<div class="tile wide"><div class="l">In 2035, AI will...</div><div class="quote">${esc(A.future)}</div></div>` : ''}
    </div>
    <div class="actions"><button class="ghostbtn" id="cp">Copy my summary</button></div>
  </div>`;
  document.getElementById('cp').onclick = () => {
    const txt = `Turing test and AI: ${name}\n${badge(r)}, ${r} of 5 humans spotted\nAI closeness to human-level: ${A.agi_distance}/100\nToday's AI is: ${A.closest}\nI feel: ${A.feeling}\nBiggest concern: ${A.concern}\nMost exciting: ${A.excite}\nMatched research on ${agree} of 8 abilities${A.future ? '\nIn 2035, AI will ' + A.future.replace(/^in 2035,? ai will\.*\s*/i, '') : ''}`;
    try { navigator.clipboard.writeText(txt).then(() => document.getElementById('cp').textContent = 'Copied'); } catch (e) {}
  };
  classCompare();
}

async function classCompare(){
  if (!CONNECTED) return;
  try {
    const rows = (await (await fetch(SCRIPT_URL + '?section=' + encodeURIComponent(SECTION) + '&t=' + Date.now())).json()).rows || [];
    if (rows.length < 3) return;
    const ts = rows.map(r => Number(r.turing_score)).filter(v => !isNaN(v));
    const ds = rows.map(r => Number(r.agi_distance)).filter(v => !isNaN(v));
    const avgT = (ts.reduce((a, b) => a + b, 0) / ts.length).toFixed(1);
    const avgD = Math.round(ds.reduce((a, b) => a + b, 0) / ds.length);
    const same = pct(rows.filter(r => r.feeling === A.feeling).length, rows.length);
    document.getElementById('clsT').innerHTML = `<span>Class average: ${avgT} of 5</span>`;
    document.getElementById('clsD').textContent = 'Class average ' + avgD;
    const mk = document.getElementById('clsMark'); mk.style.left = avgD + '%'; mk.classList.remove('hidden');
    document.getElementById('clsF').innerHTML = `<span>${same}% of the class feels the same</span>`;
  } catch (e) {}
}

/* ============ CLASS RESULTS (?results) ============ */
let rows = [], showRV = false;
const PEW_US = [50, 38, 10], PEW_GL = [34, 42, 16];
const cnt = (k, opts) => opts.map(o => rows.filter(r => r[k] === o).length);
const stk = (vals, cls) => `<div class="stk">${vals.map((v, i) => v > 0 ? `<div class="${cls[i]}" style="width:${v}%">${v >= 8 ? v + '%' : ''}</div>` : '').join('')}</div>`;
function hbars(labels, vals, total, color){
  const z = labels.map((l, i) => [l, vals[i]]).sort((a, b) => b[1] - a[1]); const mx = Math.max(1, ...z.map(x => x[1]));
  return z.map(([l, v]) => `<div class="hb" style="--c:${color}"><div>${esc(l)}</div><div class="tr"><i style="width:${pct(v, mx)}%"></i></div><b>${pct(v, total)}%</b></div>`).join('');
}
function withOther(key, opts, total, color){
  const own = rows.map(r => String(r[key] || '').trim()).filter(v => v && !opts.includes(v));
  const vals = cnt(key, opts).concat(own.length);
  let h = hbars(opts.concat('Their own answer'), vals, total, color);
  const uniq = [...new Set(own)].sort(() => Math.random() - .5).slice(0, 6);
  if (uniq.length) h += `<div class="quotes" style="margin-top:12px">${uniq.map(q => `<div>${esc(q)}</div>`).join('')}</div>`;
  return h;
}
async function loadResults(){
  if (CONNECTED) { try { rows = (await (await fetch(SCRIPT_URL + '?section=' + encodeURIComponent(SECTION) + '&t=' + Date.now())).json()).rows || []; } catch (e) { rows = null; } }
  drawResults();
}
function drawResults(){
  let h = `<div class="rtop"><h1>What our class thinks</h1><button class="ghostbtn" id="rf">Refresh</button><button class="ghostbtn" id="rvb">${showRV ? 'Hide' : 'Show'} research view</button></div>`;
  if (!CONNECTED) { app.innerHTML = h + '<div class="warn">Connect the survey to a Google Sheet to see results.</div>'; return wireR(); }
  if (rows === null) { app.innerHTML = h + '<div class="warn">Could not load results. Check the web app is deployed for "Anyone".</div>'; return wireR(); }
  const n = rows.length;
  if (!n) { app.innerHTML = h + '<section class="card">No responses yet.</section>'; return wireR(); }
  const ts = rows.map(r => Number(r.turing_score)).filter(v => !isNaN(v));
  const ds = rows.filter(r => r.agi_distance !== '').map(r => Number(r.agi_distance)).filter(v => !isNaN(v));
  const avgT = ts.length ? (ts.reduce((a, b) => a + b, 0) / ts.length).toFixed(1) : '0';
  const avgD = ds.length ? Math.round(ds.reduce((a, b) => a + b, 0) / ds.length) : 0;
  h += `<div class="kpis">
    <div class="kpi" style="--c:var(--lagoon)"><b>${n}</b><span>responses</span></div>
    <div class="kpi" style="--c:var(--sage)"><b>${avgT}/5</b><span>humans spotted</span></div>
    <div class="kpi" style="--c:var(--ochre)"><b>${avgD}</b><span>closeness to human-level</span></div>
    <div class="kpi" style="--c:var(--plum)"><b>${pct(rows.filter(r => r.use === USE[0] || r.use === USE[1]).length, n)}%</b><span>use AI daily</span></div></div>`;
  h += `<section class="card" style="${acc('lagoon')}"><div class="qt">Who spotted the human</div>` + TURING.map(t => {
    const ok = rows.filter(r => r[t.id] === 'correct').length, tot = rows.filter(r => r[t.id]).length, p = pct(ok, tot);
    return `<div class="lab"><span>${esc(t.q)}</span><b>${p}%</b></div>${stk([p, 100 - p], ['ks','kc'])}`; }).join('') +
    `<div class="lg"><span style="--c:var(--sage)">Spotted the human</span><span style="--c:var(--clay)">Fooled by the AI</span></div></section>`;
  const fc = cnt('feeling', FEEL), ft = fc.reduce((a, b) => a + b, 0);
  h += `<section class="card" style="${acc('sage')}"><div class="qt">Excited or concerned?</div>
    <div class="lab"><span>Our class</span></div>${stk(fc.map(v => pct(v, ft)), ['kc','kg','ks'])}
    <div class="lab"><span>US adults</span></div>${stk(PEW_US, ['kc','kg','ks'])}
    <div class="lab"><span>Global median, 25 countries</span></div>${stk(PEW_GL, ['kc','kg','ks'])}
    <div class="lg"><span style="--c:var(--clay)">More concerned</span><span style="--c:#A39C8F">Equally both</span><span style="--c:var(--sage)">More excited</span></div>
    <div class="src">Pew Research Center, 2025</div></section>`;
  h += `<section class="card" style="${acc('plum')}"><div class="qt">AI compared with a typical adult</div>` + ABILITIES.map(([k, nm, v]) => {
    const c = cnt(k, AB), t = c.reduce((a, b) => a + b, 0);
    return `<div class="lab"><span>${esc(nm)}</span>${showRV ? `<span class="pill pm">Research: ${v}</span>` : ''}</div>${stk(c.map(x => pct(x, t)), ['kp','ko','ks'])}`; }).join('') +
    `<div class="lg"><span style="--c:var(--plum)">AI ahead</span><span style="--c:var(--ochre)">About even</span><span style="--c:var(--sage)">Humans ahead</span></div></section>`;
  h += `<section class="card" style="${acc('plum')}"><div class="qt">What kind of intelligence is today's AI?</div>${hbars(CLOSEST, cnt('closest', CLOSEST), n, 'var(--plum)')}</section>`;
  const bins = Array(11).fill(0); ds.forEach(v => bins[Math.min(10, Math.round(v / 10))]++); const bm = Math.max(1, ...bins);
  h += `<section class="card" style="${acc('ochre')}"><div class="qt">How close is AI to human-level intelligence?</div>
    <div class="hist">${bins.map(b => `<div style="height:${pct(b, bm)}%" title="${b}"></div>`).join('')}</div>
    <div class="ends"><span>0 · Nowhere close</span><span>Already there · 100</span></div></section>`;
  h += `<section class="card" style="${acc('lagoon')}"><div class="qt">Where we would most welcome AI</div>${withOther('welcome', WELCOME, n, 'var(--lagoon)')}</section>`;
  h += `<section class="card" style="${acc('clay')}"><div class="qt">Biggest concern</div>${withOther('concern', CONCERN, n, 'var(--clay)')}</section>`;
  h += `<section class="card" style="${acc('sage')}"><div class="qt">Most exciting</div>${withOther('excite', EXCITE, n, 'var(--sage)')}</section>`;
  const qs = [...new Set(rows.map(r => String(r.future || '').trim()).filter(Boolean))].sort(() => Math.random() - .5).slice(0, 8);
  h += `<section class="card" style="${acc('ochre')}"><div class="qt">In 2035, AI will...</div>${qs.length ? `<div class="quotes">${qs.map(q => `<div>${esc(q)}</div>`).join('')}</div>` : '<p>No sentences yet.</p>'}</section>`;
  app.innerHTML = h; wireR();
}
function wireR(){
  document.getElementById('rf').onclick = loadResults;
  document.getElementById('rvb').onclick = () => { showRV = !showRV; drawResults(); };
}

if (params.has('results')) loadResults(); else renderSurvey();
})();
</script>
</body>
